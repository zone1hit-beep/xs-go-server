# fly.toml app configuration file generated for xs-go-server on 2026-07-26T19:40:05+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'xs-go-server'
# sjc (San Jose): khu vực gần Nhật NHẤT mà YouTube không chặn tải phụ đề
# (sin/nrt đều bị "Sign in to confirm you're not a bot" — đo thực tế 10-11/8/2026).
primary_region = 'sjc'

[build]
[env]
  PORT = '8091'
  XSGO_DB = '/data/xs_go.db'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8091
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
